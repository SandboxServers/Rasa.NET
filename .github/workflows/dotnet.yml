name: .NET

on:
  push:
    branches: [ master, development ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-24.04
    # The default is 360 minutes; a healthy run takes a fraction of this.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      # A test host that outgrows the runner's 16 GB makes the VM stop answering and GitHub
      # reports "lost communication" with no log. Capping the GC heap at 12 GB turns that into
      # an OutOfMemoryException with a stack trace instead.
      env:
        DOTNET_GCHeapHardLimit: '0x300000000'
      run: >
        dotnet test --no-build --verbosity normal
        --blame-hang-timeout 10m
        --logger "trx;LogFileName=results.trx"
        --results-directory TestResults
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults/
        retention-days: 14
